<!DOCTYPE html>
<html>
<head>
  <title>Task 4 </title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .sidenav {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 60px;
    }

    .sidenav a {
      padding: 16px;
      position: absolute;
      left: 0;
      transition: 0.3s;
      text-decoration: none;
      font-size: 20px;
      color: white;
      width: 160px;
      border-radius: 0 5px 5px 0;
    }

    .sidenav a:hover {
      left: 160px;
    }

    #green { top: 60px; background-color: #04AA6D; }
    #blue { top: 120px; background-color: #2196F3; }
    #red { top: 180px; background-color: #f44336; }
    #black { top: 240px; background-color: #555; }

    .main {
      margin-left: 200px;
      padding: 20px;
    }

    h2 {
      color: #4169E1;
    }
  </style>
</head>
<body>

<div class="sidenav">
  <a href="#" id="green">Green</a>
  <a href="#" id="blue">Blue</a>
  <a href="#" id="red">Red</a>
  <a href="#" id="black">Black</a>
</div>

<div class="main">
  <h2>Task 4</h2>
  <h3>Hoverable Sidenav Buttons</h3>
  <p>Hover over the buttons in the left side navigation to open them.</p>
</div>

</body>
</html>
