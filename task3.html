<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    table {
      border-collapse: collapse;
      margin: 0 auto;
    }
    td {
      padding: 8px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
    }
    h2 {
      text-align: center;
      color: blue;
    }
    .submit-btn {
      display: block;
      margin: 10px auto;
    }
    .link-row {
      text-align: right;
      padding-right: 10px;
    }
  </style>
</head>
<body>

  <h2>Registration form</h2>

  <form>
    <table border="1">
      <tr>
        <td><b>First Name</b></td>
        <td><input type="text" name="fname" required></td>
      </tr>
      <tr>
        <td><b>Last Name</b></td>
        <td><input type="text" name="lname" required></td>
      </tr>
      <tr>
        <td><b>Email</b></td>
        <td><input type="email" name="email" required></td>
      </tr>
      <tr>
        <td><b>Password</b></td>
        <td><input type="password" name="password" required></td>
      </tr>
      <tr>
        <td><b>Re-enter Password</b></td>
        <td><input type="password" name="repassword" required></td>
      </tr>
      <tr>
        <td><b>Gender:</b></td>
        <td>
          <input type="radio" name="gender" value="Male" required> Male
          <input type="radio" name="gender" value="Female"> Female
        </td>
      </tr>
      <tr>
        <td><b>Age:</b></td>
        <td><input type="number" name="age" min="0" required></td>
      </tr>
      <tr>
        <td><b>Phone Number</b></td>
        <td><input type="text" name="phone" required></td>
      </tr>
      <tr>
        <td><b>Address</b></td>
        <td><textarea name="address" rows="3" required></textarea></td>
      </tr>
      <tr>
        <td><b>State</b></td>
        <td><input type="text" name="state" required></td>
      </tr>
      <tr>
        <td><b>Country</b></td>
        <td>
          <select name="country" required>
            <option value="">Choose your country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><b>Languages known</b></td>
        <td>
          <input type="checkbox" name="lang" value="English"> English
          <input type="checkbox" name="lang" value="Kannada"> Kannada
          <input type="checkbox" name="lang" value="Hindi"> Hindi
          <input type="checkbox" name="lang" value="Telugu"> Telugu
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="checkbox" required> Hereby I declare all the given details are true
        </td>
      </tr>
      <tr>
        <td colspan="2" class="link-row">
          <a href="https://acharya.ac.in" target="_blank">Log in to <span style="color:blue">Acharya</span> website</a>
        </td>
      </tr>
    </table>

    <input type="submit" value="Register" class="submit-btn">
  </form>

</body>
</html>
