<!DOCTYPE html>
<html>
<head>
  <title>Task 2</title>
  <style>
    .vertical-nav {
      width: 150px;
      background-color: #d4edf4;
      border: 2px solid black;
      padding: 0;
    }
    .vertical-nav a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: black;
    }
    .vertical-nav a.home {
      background-color: orange;
      color: white;
    }

    .horizontal-nav {
      margin-top: 20px;
      padding: 10px;
      background-color: lightgray;
      text-align: center;
      border: 2px solid black;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .horizontal-nav a {
      margin: 0 15px;
      text-decoration: none;
      color: blue;
      padding: 5px;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">Task 2</h2>

<h3>Vertical Navigation Bar</h3>
<div class="vertical-nav">
  <a href="#" class="home">Home</a>
  <a href="#">Java</a>
  <a href="#">CSS</a>
  <a href="#">HTML</a>
  <a href="#">Bootstrap</a>
</div>

<h3 style="text-align:center;">Horizontal Navigation Bar</h3>
<div class="horizontal-nav">
  <a href="#">Home</a>
  <a href="#">Java</a>
  <a href="#">HTML</a>
  <a href="#">CSS</a>
</div>

</body>
</html>
